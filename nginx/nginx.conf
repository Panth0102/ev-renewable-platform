worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # ── Upstream services ─────────────────────────────────────
    upstream backend {
        server backend:8080;
    }

    upstream optimization {
        server optimization:8001;
    }

    server {
        listen 80;
        server_name _;

        # ── React SPA static files ────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        # Long-cache for hashed assets, no-cache for index.html
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Spring Boot API ───────────────────────────────────
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── Swagger UI (Spring) ───────────────────────────────
        location /swagger-ui/ {
            proxy_pass         http://backend/swagger-ui/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location /api-docs {
            proxy_pass         http://backend/api-docs;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Spring Actuator ───────────────────────────────────
        location /actuator/ {
            proxy_pass         http://backend/actuator/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── FastAPI Optimization Engine ───────────────────────
        # /optimize/* → optimization service (strips /optimize prefix)
        location /optimize {
            proxy_pass         http://optimization/optimize;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # ── FastAPI docs ──────────────────────────────────────
        location /optimization/docs {
            proxy_pass         http://optimization/docs;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Nginx health probe (used by Docker healthcheck) ───
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── SPA catch-all: serve index.html for all other paths
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
