# ============================================================
# application-dev.properties — local development overrides
# ============================================================

# Show SQL in console during development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ddl-auto=update is safe in dev — Hibernate syncs the schema
# Switch back to validate once the DB is stable
spring.jpa.hibernate.ddl-auto=update

# Verbose logging
logging.level.com.evrenewable=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.root=INFO

# Disable security in Swagger for easy local testing
springdoc.swagger-ui.disable-swagger-default-url=false
