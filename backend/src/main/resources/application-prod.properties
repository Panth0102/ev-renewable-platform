# ============================================================
# application-prod.properties — production overrides
# Active when SPRING_PROFILES_ACTIVE=prod (Railway deployment)
# ============================================================

# ── JPA — validate schema, don't auto-alter ──────────────────
spring.jpa.hibernate.ddl-auto=validate

# ── SSL required for Supabase / Neon ─────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ev_renewable_db}?sslmode=require

# ── Logging — quieter in prod ────────────────────────────────
logging.level.root=WARN
logging.level.com.evrenewable=INFO
spring.jpa.show-sql=false
