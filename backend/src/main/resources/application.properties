# ============================================================
# application.properties — base config (all profiles)
# Environment-specific values come from application-{profile}.properties
# Secrets are injected from backend/.env via environment variables
# ============================================================

spring.application.name=GreenCharge
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Server ───────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ── DataSource (PostgreSQL) ──────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ev_renewable_db}
spring.datasource.username=${DB_USERNAME:ev_user}
spring.datasource.password=${DB_PASSWORD:ev_secure_pass_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool ─────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=GreenChargePool

# ── JPA / Hibernate ──────────────────────────────────────────
# validate: Hibernate checks the schema matches entities (safe for prod)
# update:   Hibernate alters tables to match (dev convenience only)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:changeme_generate_with_openssl_rand_hex_32}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── CORS ─────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Optimization service ─────────────────────────────────────
optimization.service.url=${OPTIMIZATION_SERVICE_URL:http://localhost:8001}

# ── Actuator (health check endpoint) ────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ── SpringDoc / Swagger ──────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
